<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="color-scheme" content="dark" />
    <title>LitematicaQL Preview</title>
  </head>
  <body>
    <main id="viewer" aria-label="Interactive Litematica schematic preview">
      <canvas id="schematic-canvas"></canvas>

      <section id="status" class="status" role="status" aria-live="polite">
        <div class="status__mark" aria-hidden="true"><span></span><span></span><span></span></div>
        <div>
          <p id="status-title" class="status__title">Preparing renderer</p>
          <p id="status-detail" class="status__detail">Loading block resources…</p>
        </div>
      </section>

      <aside id="file-info" class="file-info" hidden>
        <p id="file-name" class="file-info__name"></p>
        <p id="file-dimensions" class="file-info__dimensions"></p>
      </aside>

      <p id="controls-hint" class="controls-hint" hidden>
        Drag to orbit · Scroll to zoom · Right-drag to pan
      </p>
    </main>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
