[package]
name = "litematicaql-native"
version = "0.1.0"
edition = "2021"
publish = false

[lib]
name = "litematicaql_native"
# `staticlib` serves the app and extension; `rlib` exposes the same internals to
# integration tests.
crate-type = ["staticlib", "rlib"]

# Debug info is the most expensive part of an unoptimized build. Line tables
# keep a panic's source line readable; dependency debug info is never read, so
# none of it is generated. The release profile below is unaffected.
[profile.dev]
debug = "line-tables-only"

[profile.dev.package."*"]
debug = false

# The release profile keeps unwinding because the fallible C entry points use
# `catch_unwind`; aborting would let panics terminate the host process.
# Fat LTO and one codegen unit reduce the machine code embedded by each host.
[profile.release]
lto = "fat"
codegen-units = 1

[dependencies]
litematica-preview-core = { git = "https://github.com/Arcadi4/litematica-preview-core", rev = "87838a6dcca60010f2af63dd6c733a5010ec6a27" }
nucleation = { version = "=0.11.0", default-features = false, features = [
  "meshing",
] }

[dev-dependencies]
quartz_nbt = { version = "0.2.9", features = ["preserve_order"] }
nucleation = { version = "=0.11.0", default-features = false, features = [
  "meshing",
] }
flate2 = { version = "1", default-features = false, features = ["zlib-rs"] }
lz4_flex = { version = "0.14", default-features = false, features = ["std"] }

[patch.crates-io]
schematic-mesher = { git = "https://github.com/Schem-at/Schematic-Mesher.git", rev = "286323e472cd8a5363b66a035a3be02ecdd4f164" }
