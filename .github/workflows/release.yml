name: Release

on:
  push:
    tags:
      - "v*.*.*"

permissions:
  contents: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  validate:
    name: Validate release tag
    runs-on: ubuntu-latest
    steps:
      - name: Validate release tag
        shell: bash
        run: |
          set -euo pipefail

          if [[ ! "$GITHUB_REF_NAME" =~ ^v[0-9]+\.[0-9]+\.[0-9]+([-.][0-9A-Za-z.-]+)?$ ]]; then
            echo "Release tags must use semantic versioning, for example v0.1.0." >&2
            exit 1
          fi

  build:
    name: Build ${{ matrix.arch }}
    needs: validate
    runs-on: xcode-27
    strategy:
      fail-fast: false
      matrix:
        arch: [arm64, x86_64]
    env:
      APP_NAME: LitematicaQL
      CI: true
      ARCH: ${{ matrix.arch }}
      # Drives `just native` and the Xcode pre-build phase to the matrix
      # architecture instead of building both.
      ARCHS: ${{ matrix.arch }}

    steps:
      - name: Check out source
        uses: actions/checkout@v7
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Set up Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-apple-darwin,x86_64-apple-darwin

      - name: Cache Rust build
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: Core
          shared-key: native-bridge

      - name: Install the toolchain entry point
        run: brew install just xcodegen

      - name: Test
        if: matrix.arch == 'arm64'
        run: just test

      - name: Archive and package
        env:
          VERSION: ${{ github.ref_name }}
          CURRENT_PROJECT_VERSION: ${{ github.run_number }}
        run: just release "$VERSION" "$ARCH"

      - name: Upload per-arch artifact
        uses: actions/upload-artifact@v7
        with:
          name: ${{ env.APP_NAME }}-${{ github.ref_name }}-${{ matrix.arch }}
          path: |
            build/release/*.zip
            build/release/*.sha256
          if-no-files-found: error

  release:
    name: Publish GitHub release
    needs: build
    runs-on: ubuntu-latest
    env:
      APP_NAME: LitematicaQL
      VERSION: ${{ github.ref_name }}
    steps:
      - name: Download per-arch artifacts
        uses: actions/download-artifact@v8
        with:
          path: build/release
          merge-multiple: true

      - name: Publish GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail

          ls -la build/release

          gh release create "$GITHUB_REF_NAME" \
            "$GITHUB_WORKSPACE/build/release/$APP_NAME-$VERSION-arm64.zip" \
            "$GITHUB_WORKSPACE/build/release/$APP_NAME-$VERSION-arm64.zip.sha256" \
            "$GITHUB_WORKSPACE/build/release/$APP_NAME-$VERSION-x86_64.zip" \
            "$GITHUB_WORKSPACE/build/release/$APP_NAME-$VERSION-x86_64.zip.sha256" \
            --repo "$GITHUB_REPOSITORY" \
            --verify-tag \
            --title "$APP_NAME $VERSION" \
            --generate-notes \
            --notes $'This release ships separate Apple silicon (arm64) and Intel (x86_64) builds; download the one matching your Mac.\n\nThe build is ad-hoc signed and not notarized, so macOS may require you to approve it in System Settings > Privacy & Security after opening the app.'

  update-homebrew-tap:
    name: Update Homebrew tap
    needs: release
    runs-on: ubuntu-latest
    steps:
      - name: Trigger arcadi4/homebrew-tap cask update
        env:
          GH_TOKEN: ${{ secrets.HOMEBREW_TAP_TOKEN }}
          TAG: ${{ github.ref_name }}
        shell: bash
        run: |
          set -euo pipefail

          if [ -z "$GH_TOKEN" ]; then
            echo "HOMEBREW_TAP_TOKEN secret is not set; skipping tap update."
            exit 0
          fi

          gh workflow run update-litematicaql-cask.yml \
            --repo arcadi4/homebrew-tap \
            --field version="${TAG#v}"
