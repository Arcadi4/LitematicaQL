version: 2
updates:
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"

  - package-ecosystem: "npm"
    directory: "/Renderer"
    schedule:
      interval: "weekly"

  - package-ecosystem: "cargo"
    directory: "/Native"
    schedule:
      interval: "weekly"
    ignore:
      - dependency-name: "nucleation"
