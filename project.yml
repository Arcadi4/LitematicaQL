name: LitematicaQL

options:
  minimumXcodeGenVersion: 2.46.0
  deploymentTarget:
    macOS: "13.0"
  createIntermediateGroups: true
  groupSortPosition: top

configs:
  Debug: debug
  Release: release

settings:
  base:
    CLANG_ENABLE_MODULES: YES
    CURRENT_PROJECT_VERSION: 1
    DEVELOPMENT_TEAM: ""
    ENABLE_HARDENED_RUNTIME: YES
    MARKETING_VERSION: 0.1.0
    SWIFT_STRICT_CONCURRENCY: complete
    SWIFT_VERSION: 6.0

targets:
  LitematicaQL:
    type: application
    platform: macOS
    sources:
      - path: App
      - path: LitematicaQL.icon
      - path: Shared
      - path: Resources/Renderer
        type: folder
        buildPhase: resources
      - path: Fixtures/LitematicaQL-Demo.litematic
        buildPhase: resources
      - path: Renderer/third-party
        type: folder
        buildPhase: resources
    info:
      path: App/Info.plist
      properties:
        CFBundleDisplayName: LitematicaQL
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        CFBundleDocumentTypes:
          - CFBundleTypeName: Litematica Schematic
            CFBundleTypeRole: Viewer
            LSHandlerRank: Alternate
            LSItemContentTypes:
              - moe.arcadia.litematic
        LSApplicationCategoryType: public.app-category.utilities
        LSSupportsOpeningDocumentsInPlace: true
        NSHumanReadableCopyright: Copyright © 2026 4rcadia
        UTImportedTypeDeclarations:
          - UTTypeIdentifier: moe.arcadia.litematic
            UTTypeDescription: Litematica Schematic
            UTTypeConformsTo:
              - public.data
              - public.content
            UTTypeTagSpecification:
              public.filename-extension:
                - litematic
              public.mime-type: application/x-litematic
    entitlements:
      path: App/LitematicaQL.entitlements
      properties:
        com.apple.security.app-sandbox: true
        com.apple.security.files.user-selected.read-only: true
        com.apple.security.network.client: true
    settings:
      base:
        ASSETCATALOG_COMPILER_APPICON_NAME: LitematicaQL
        CODE_SIGN_ENTITLEMENTS: App/LitematicaQL.entitlements
        INFOPLIST_FILE: App/Info.plist
        PRODUCT_BUNDLE_IDENTIFIER: moe.arcadia.LitematicaQL
        PRODUCT_NAME: LitematicaQL
    dependencies:
      - target: LitematicaQLPreview
        embed: true

  LitematicaQLPreview:
    type: app-extension
    platform: macOS
    sources:
      - path: PreviewExtension
      - path: Shared
      - path: Resources/Renderer
        type: folder
        buildPhase: resources
    info:
      path: PreviewExtension/Info.plist
      properties:
        CFBundleDisplayName: LitematicaQL Preview
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        NSExtension:
          NSExtensionAttributes:
            QLIsDataBasedPreview: false
            QLSupportedContentTypes:
              - moe.arcadia.litematic
            QLSupportsSearchableItems: false
          NSExtensionPointIdentifier: com.apple.quicklook.preview
          NSExtensionPrincipalClass: $(PRODUCT_MODULE_NAME).PreviewViewController
    entitlements:
      path: PreviewExtension/LitematicaQLPreview.entitlements
      properties:
        com.apple.security.app-sandbox: true
        com.apple.security.files.user-selected.read-only: true
        com.apple.security.network.client: true
    settings:
      base:
        APPLICATION_EXTENSION_API_ONLY: YES
        CODE_SIGN_ENTITLEMENTS: PreviewExtension/LitematicaQLPreview.entitlements
        INFOPLIST_FILE: PreviewExtension/Info.plist
        PRODUCT_BUNDLE_IDENTIFIER: moe.arcadia.LitematicaQL.PreviewExtension
        PRODUCT_NAME: LitematicaQLPreview
        SKIP_INSTALL: YES
    dependencies:
      - sdk: Quartz.framework
      - sdk: WebKit.framework

schemes:
  LitematicaQL:
    build:
      targets:
        LitematicaQL: all
    run:
      config: Debug
    archive:
      config: Release
